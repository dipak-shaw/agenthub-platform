[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "agent-hub-platform"
version = "0.0.0"
description = "A small config-driven Q&A agent platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "typer>=0.15,<1",
    "httpx>=0.28,<1",
    "pydantic-ai-slim[openai]>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "aiosqlite>=0.21,<1",
    "beautifulsoup4>=4.13,<5",
    "ddgs>=9,<10",
    "pyyaml>=6,<7",
]

[project.scripts]
agent-hub = "agent_hub.cli:app"

[project.optional-dependencies]
entra = [
    "azure-identity>=1,<2",
]
tracing = [
    "langfuse>=3,<4",
    "opentelemetry-sdk>=1,<2",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
]

[tool.uv.build-backend]
module-name = "agent_hub"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["agent_hub/core"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
