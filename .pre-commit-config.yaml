repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict core typecheck
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: web-lint
        name: Web lint and formatting
        entry: bash -c 'pnpm --dir web lint && pnpm --dir web format:check'
        language: system
        pass_filenames: false
        files: ^web/
